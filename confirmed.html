<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Confirmed - Marquee Matinee</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0d12;
        color: #f5f0e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #161620;
        border-radius: 16px;
        padding: 48px 32px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        text-align: center;
        animation: fadeUp 0.5s ease-out;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(0, 229, 204, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 28px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .message {
        color: #8888a0;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background: #ff2d78;
        color: white;
        text-decoration: none;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .hint {
        color: #3a3a4a;
        font-size: 13px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>You're Verified</h1>
      <p class="message">
        Your email has been confirmed. Head back to the app and sign in.
      </p>
      <a class="btn" href="marqueematinee://">Open Marquee Matinee</a>
      <p class="hint">If the button doesn't work, open the app manually.</p>
    </div>
  </body>
</html>
