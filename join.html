<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join League - Marquee Matinee</title>
    <meta property="og:title" content="You're invited to Marquee Matinee" />
    <meta
      property="og:description"
      content="Pick. Watch. Vote. Win. Join a movie league and compete with friends."
    />
    <meta property="og:image" content="https://marqueematinee.com/icon.png" />
    <meta property="og:type" content="website" />
    <meta name="apple-itunes-app" content="app-id=6766718590" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0d12;
        color: #f5f0e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #161620;
        border-radius: 16px;
        padding: 48px 32px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        text-align: center;
        animation: fadeUp 0.5s ease-out;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .emoji {
        font-size: 36px;
        line-height: 1;
        margin-bottom: 12px;
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #ff2d78;
        text-transform: uppercase;
        margin-bottom: 32px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .message {
        color: #8888a0;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background: #ff2d78;
        color: white;
        text-decoration: none;
      }
      .btn:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🎬</div>
      <div class="brand">MARQUEE MATINEE</div>
      <h1>You've Been Invited!</h1>
      <p class="message">
        Someone wants you in their movie league. Tap below to join.
      </p>
      <a class="btn" id="join-btn" href="#">Open Marquee Matinee</a>
    </div>

    <script>
      var params = new URLSearchParams(window.location.search);
      var code = (params.get("code") || "").trim();
      var deepLink = "marqueematinee://join?code=" + encodeURIComponent(code);
      var isAndroid = /android/i.test(navigator.userAgent);
      var storeUrl = isAndroid
        ? "https://play.google.com/store/apps/details?id=com.marqueematinee.app"
        : "https://apps.apple.com/us/app/marquee-matinee/id6766718590";

      function openApp() {
        // Try deep link
        window.location.href = deepLink;

        // If still here after 1.5s, app didn't open — go to store
        setTimeout(function () {
          window.location.href = storeUrl;
        }, 1500);
      }

      document
        .getElementById("join-btn")
        .addEventListener("click", function (e) {
          e.preventDefault();
          openApp();
        });

      // Auto-open on load if there's a code
      if (code) {
        openApp();
      }
    </script>
  </body>
</html>
